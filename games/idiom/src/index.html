<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>離線成語填字</title>
  <meta name="description" content="可離線遊玩的單機成語填字，詞庫取自教育部《成語典》">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="成語填字">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>有新版本可以使用</span>
    <button type="button" id="update-btn" class="banner-btn">重新整理以更新</button>
  </div>

  <main id="home" class="screen home">
    <header class="home-header">
      <div class="hero-deco" aria-hidden="true"><span style="left:58%;top:8%;font-size:30px">諾</span><span style="left:78%;top:4%;font-size:24px">千</span><span style="left:88%;top:40%;font-size:30px">金</span><span style="left:66%;top:54%;font-size:22px">竹</span><span style="left:82%;top:74%;font-size:24px">成</span></div>
      <div class="hero-title">
        <h1>成語填字</h1>
        <p class="hero-sub">選字完成成語・學會用法</p>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="切換主題"></button>
    </header>

    <p id="offline-status" class="offline-status" role="status"></p>
    <div id="home-notice" class="notice" role="alert" hidden></div>

    <button type="button" id="continue-btn" class="continue-btn" hidden>
      <span class="continue-title">繼續遊戲</span>
      <span id="continue-detail" class="continue-detail"></span>
    </button>

    <h2 class="section-title">開始新局</h2>
    <div id="difficulty-list" class="difficulty-list"></div>

    <nav class="home-links">
      <a id="portal-link" class="link-btn" href="../" hidden>‹ 所有遊戲</a>
      <button type="button" id="book-btn" class="link-btn">成語本</button>
      <button type="button" id="rules-btn" class="link-btn">玩法</button>
      <button type="button" id="stats-btn" class="link-btn">統計</button>
      <button type="button" id="source-btn" class="link-btn">資料來源</button>
    </nav>
  </main>

  <main id="game" class="screen game" hidden>
    <header class="game-bar">
      <button type="button" id="home-btn" class="bar-btn" aria-label="回首頁">‹ 首頁</button>
      <div class="game-info">
        <span id="game-difficulty"></span>
        <span class="dot">·</span>
        <span id="timer" aria-label="耗時">00:00</span>
        <span class="dot">·</span>
        <span id="mistakes">錯誤 0</span>
      </div>
      <button type="button" id="menu-btn" class="bar-btn" aria-label="選單">選單</button>
    </header>

    <div class="play-area">
      <div class="board-area">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="成語填字盤面"></div>
        </div>
        <div id="clue" class="clue"></div>
        <div id="pause-cover" class="pause-cover" hidden>
          <p>已暫停</p>
          <button type="button" id="resume-btn" class="primary-btn">繼續</button>
        </div>
      </div>

      <div class="controls">
        <p id="game-message" class="game-message" aria-live="polite"></p>
        <div class="tools">
          <button type="button" id="undo-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">↶</span>復原</button>
          <button type="button" id="erase-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⌫</span>清除</button>
          <button type="button" id="hint-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">💡</span>提示<span id="hint-count" class="tool-badge">0</span></button>
          <button type="button" id="pause-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⏸</span>暫停</button>
        </div>
        <div id="bank" class="bank" role="group" aria-label="字庫"></div>
      </div>
    </div>
  </main>

  <main id="book" class="screen book" hidden>
    <header class="book-bar">
      <button type="button" id="book-back" class="bar-btn" aria-label="回首頁">‹ 首頁</button>
      <h1>成語本</h1>
      <span class="bar-spacer"></span>
    </header>
    <p id="book-summary" class="book-summary"></p>
    <div class="book-tabs" role="tablist">
      <button type="button" class="book-tab" data-tab="all" role="tab" aria-selected="true">全部</button>
      <button type="button" class="book-tab" data-tab="review" role="tab" aria-selected="false">待複習</button>
    </div>
    <div class="book-filters">
      <select id="book-level" aria-label="常見度">
        <option value="0">全部常見度</option>
        <option value="1">常見</option>
        <option value="2">一般</option>
        <option value="3">進階</option>
      </select>
      <input id="book-search" type="search" placeholder="搜尋成語或釋義" aria-label="搜尋成語或釋義">
    </div>
    <ul id="book-list" class="book-list"></ul>
  </main>

  <div id="loading" class="overlay" hidden>
    <div class="dialog loading-dialog" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">出題中…</p>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</body>
</html>
