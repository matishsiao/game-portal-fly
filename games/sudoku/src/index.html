<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>離線數獨</title>
  <meta name="description" content="可離線遊玩的單機數獨">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="數獨">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>有新版本可以使用</span>
    <button type="button" id="update-btn" class="banner-btn">重新整理以更新</button>
  </div>

  <main id="home" class="screen home">
    <header class="home-header">
      <div class="hero-deco" aria-hidden="true"><span style="left:62%;top:14%;font-size:30px">5</span><span style="left:80%;top:8%;font-size:22px">3</span><span style="left:90%;top:46%;font-size:26px">9</span><span style="left:70%;top:58%;font-size:20px">1</span><span style="left:84%;top:78%;font-size:18px">4</span></div>
      <div class="hero-title">
        <h1>數獨</h1>
        <p class="hero-sub">9 × 9 經典數獨・邏輯推理</p>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="切換主題"></button>
    </header>

    <p id="offline-status" class="offline-status" role="status"></p>
    <div id="home-notice" class="notice" role="alert" hidden></div>

    <button type="button" id="continue-btn" class="continue-btn" hidden>
      <span class="continue-title">繼續遊戲</span>
      <span id="continue-detail" class="continue-detail"></span>
    </button>

    <h2 class="section-title">開始新局</h2>
    <div class="difficulty-list">
      <button type="button" class="difficulty-btn" data-difficulty="easy">簡單<small>提示 30 次</small></button>
      <button type="button" class="difficulty-btn" data-difficulty="medium">中等<small>提示 20 次</small></button>
      <button type="button" class="difficulty-btn" data-difficulty="hard">困難<small>提示 10 次</small></button>
      <button type="button" class="difficulty-btn" data-difficulty="expert">專家<small>提示 5 次</small></button>
    </div>

    <nav class="home-links">
      <a id="portal-link" class="link-btn" href="../" hidden>‹ 所有遊戲</a>
      <button type="button" id="stats-btn" class="link-btn">統計</button>
    </nav>
  </main>

  <main id="game" class="screen game" hidden>
    <header class="game-bar">
      <button type="button" id="home-btn" class="bar-btn" aria-label="回首頁">‹ 首頁</button>
      <div class="game-info">
        <span id="game-difficulty"></span>
        <span class="dot">·</span>
        <span id="timer" aria-label="耗時">00:00</span>
        <span class="dot">·</span>
        <span id="mistakes">錯誤 0</span>
      </div>
      <button type="button" id="menu-btn" class="bar-btn" aria-label="選單">選單</button>
    </header>

    <div class="play-area">
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="數獨棋盤"></div>
        <div id="pause-cover" class="pause-cover" hidden>
          <p>已暫停</p>
          <button type="button" id="resume-btn" class="primary-btn">繼續</button>
        </div>
      </div>

      <div class="controls">
        <p id="game-message" class="game-message" aria-live="polite"></p>
        <div class="tools">
          <button type="button" id="undo-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">↶</span>復原</button>
          <button type="button" id="erase-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⌫</span>清除</button>
          <button type="button" id="notes-btn" class="tool-btn" aria-pressed="false"><span class="tool-icon" aria-hidden="true">✎</span>筆記<span id="notes-state" class="tool-state">關</span></button>
          <button type="button" id="hint-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">💡</span>提示<span id="hint-count" class="tool-badge">0</span></button>
          <button type="button" id="pause-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⏸</span>暫停</button>
        </div>
        <div id="numpad" class="numpad"></div>
      </div>
    </div>
  </main>

  <div id="loading" class="overlay" hidden>
    <div class="dialog loading-dialog" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">出題中…</p>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</body>
</html>
