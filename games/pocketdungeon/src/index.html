<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>離線口袋地城</title>
  <meta name="description" content="可離線遊玩的單機復古像素動作 RPG：探索隨機地城、收集裝備、擊敗 Boss">
  <meta name="theme-color" content="#3a1d4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="口袋地城">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>有新版本可以使用</span>
    <button type="button" id="update-btn" class="banner-btn">重新整理以更新</button>
  </div>

  <main id="home" class="screen home">
    <header class="home-header">
      <div id="hero-deco" class="hero-deco" aria-hidden="true"></div>
      <div class="hero-title">
        <h1>口袋地城</h1>
        <p class="hero-sub">復古像素動作 RPG・一趟 5～10 分鐘</p>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="切換主題"></button>
    </header>

    <p id="offline-status" class="offline-status" role="status"></p>
    <div id="home-notice" class="notice" role="alert" hidden></div>

    <button type="button" id="continue-btn" class="continue-btn" hidden>
      <span class="continue-title">繼續探險</span>
      <span id="continue-detail" class="continue-detail"></span>
    </button>

    <p id="home-gifts" class="home-gifts" role="status" hidden></p>

    <h2 class="section-title">選擇角色</h2>
    <div id="char-list" class="char-list"></div>

    <nav class="home-links">
      <a id="portal-link" class="link-btn" href="../" hidden>‹ 所有遊戲</a>
      <button type="button" id="rules-btn" class="link-btn">玩法</button>
      <button type="button" id="stats-btn" class="link-btn">統計</button>
      <button type="button" id="settings-btn" class="link-btn">設定</button>
    </nav>
  </main>

  <main id="village" class="screen village" hidden>
    <header class="village-bar">
      <button type="button" id="village-home-btn" class="bar-btn" aria-label="回首頁">‹ 首頁</button>
      <div class="village-info">
        <img id="village-avatar" class="avatar" alt="">
        <div>
          <strong id="village-name"></strong>
          <span id="village-level" class="muted"></span>
        </div>
      </div>
      <button type="button" id="gift-btn" class="gift-btn" aria-label="獲得紀錄" hidden>🎁<b id="gift-count"></b></button>
      <span id="village-gold" class="gold-chip" aria-label="金幣"></span>
    </header>
    <nav id="village-tabs" class="village-tabs" role="tablist">
      <button type="button" role="tab" data-tab="gate">地城</button>
      <button type="button" role="tab" data-tab="shop">商店</button>
      <button type="button" role="tab" data-tab="smith">鐵匠</button>
      <button type="button" role="tab" data-tab="gem">寶石</button>
      <button type="button" role="tab" data-tab="bag">倉庫</button>
      <button type="button" role="tab" data-tab="skill">技能</button>
      <button type="button" role="tab" data-tab="hero">角色</button>
    </nav>
    <section id="village-panel" class="village-panel" role="tabpanel"></section>
    <p id="village-message" class="village-message" aria-live="polite"></p>
  </main>

  <main id="game" class="game" hidden>
    <div id="stage" class="stage">
      <canvas id="canvas" class="canvas" aria-label="地城畫面"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="hud">
        <div class="hud-player">
          <div class="portrait"><img id="hud-avatar" alt=""><b id="hud-level" class="lv-badge"></b></div>
          <div class="hud-bars">
            <div class="bar hp-bar" aria-label="HP"><span id="hp-trail" class="trail"></span><span id="hp-fill" class="fill"></span><b id="hp-text"></b></div>
            <div class="bar xp-bar" aria-label="經驗值"><span id="xp-fill" class="fill"></span></div>
            <div class="hud-line"><span id="hud-floor" class="pill"></span><span class="pill coin-pill"><i class="coin" aria-hidden="true"></i><b id="hud-gold"></b></span><span id="timer" class="pill">00:00</span></div>
            <div id="hud-status" class="hud-status" aria-live="polite"></div>
          </div>
        </div>
        <div class="hud-right">
          <button type="button" id="pause-btn" class="glass-btn" aria-label="暫停"><span data-icon="pause"></span></button>
          <div id="minimap-frame" class="minimap-frame"><canvas id="minimap" class="minimap" aria-label="小地圖"></canvas></div>
          <button type="button" id="recall-btn" class="glass-pill" aria-label="使用回城卷軸"><span class="pill-ico" data-icon="scroll"></span>回城卷軸<b id="recall-count">0</b></button>
          <div id="item-grid" class="item-grid">
            <button type="button" id="gem1-btn" class="item-btn gem-btn" hidden><span id="gem1-icon" class="ico"></span><i id="gem1-cd" class="cd"></i><b id="gem1-dur" class="gem-dur"></b><kbd>1</kbd></button>
            <button type="button" id="gem2-btn" class="item-btn gem-btn" hidden><span id="gem2-icon" class="ico"></span><i id="gem2-cd" class="cd"></i><b id="gem2-dur" class="gem-dur"></b><kbd>2</kbd></button>
          </div>
        </div>
      </div>
      <p id="toast" class="toast" aria-live="polite"></p>
      <div id="hurt-flash" class="hurt-flash"></div>
      <div id="pad" class="pad">
        <div id="stick-zone" class="stick-zone" aria-label="移動搖桿：在此按住並拖曳">
          <div id="stick" class="stick idle"><span class="stick-arrows" aria-hidden="true"></span><span id="stick-knob" class="stick-knob"></span></div>
        </div>
        <div class="buttons">
          <!-- 攻擊鈕在右下角，閃避與技能 1～4 依序環繞在左方到上方；藥水在技能環右上方。HP 低於 50% 時回復藥水閃爍、身上有異常狀態時淨化藥水閃爍。 -->
          <button type="button" id="potion-btn" class="item-btn potion-btn" aria-label="回復藥水"><span class="ico" data-icon="potion"></span><b id="potion-count" class="count">0</b><i id="potion-cd" class="cd"></i><kbd>L</kbd></button>
          <button type="button" id="cure-btn" class="item-btn cure-btn" aria-label="淨化藥水"><span class="ico" data-icon="cure"></span><b id="cure-count" class="count">0</b><i id="cure-cd" class="cd"></i><kbd>H</kbd></button>
          <button type="button" id="skill1-btn" class="act-btn skill-btn" aria-label="技能 1"><span id="skill1-icon" class="ico"></span><i id="skill1-cd" class="cd"></i><em id="skill1-name" class="btn-label"></em><kbd>U</kbd></button>
          <button type="button" id="skill2-btn" class="act-btn skill-btn" aria-label="技能 2"><span id="skill2-icon" class="ico"></span><i id="skill2-cd" class="cd"></i><em id="skill2-name" class="btn-label"></em><kbd>I</kbd></button>
          <button type="button" id="skill3-btn" class="act-btn skill-btn" aria-label="技能 3" hidden><span id="skill3-icon" class="ico"></span><i id="skill3-cd" class="cd"></i><em id="skill3-name" class="btn-label"></em><kbd>O</kbd></button>
          <button type="button" id="skill4-btn" class="act-btn skill-btn" aria-label="技能 4" hidden><span id="skill4-icon" class="ico"></span><i id="skill4-cd" class="cd"></i><em id="skill4-name" class="btn-label"></em><kbd>Y</kbd></button>
          <button type="button" id="dodge-btn" class="act-btn dodge-btn" aria-label="閃避"><span class="ico" data-icon="dodge"></span><i id="dodge-cd" class="cd"></i><em class="btn-label">閃避</em><kbd>K</kbd></button>
          <button type="button" id="attack-btn" class="act-btn attack-btn" aria-label="攻擊（按住連續攻擊）"><span class="ico" data-icon="attack"></span><em class="btn-label">攻擊</em><kbd>J</kbd></button>
        </div>
      </div>
      <div id="fade" class="fade"></div>
      <div id="pause-cover" class="pause-cover" hidden>
        <p class="pause-title">已暫停</p>
        <button type="button" id="resume-btn" class="primary-btn">繼續</button>
        <div class="pause-actions">
          <button type="button" id="scroll-btn" class="link-btn">使用回城卷軸</button>
          <button type="button" id="abandon-btn" class="link-btn danger-text">放棄探險</button>
          <button type="button" id="game-home-btn" class="link-btn">回首頁（保留進度）</button>
        </div>
      </div>
    </div>
  </main>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</body>
</html>
