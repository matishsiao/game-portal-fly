<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>滾滾解謎</title>
  <meta name="description" content="可離線遊玩的物理邏輯解謎">
  <meta name="theme-color" content="#4fb3e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14243a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="滾滾解謎">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>有新版本可以使用</span>
    <button type="button" id="update-btn" class="banner-btn">重新整理以更新</button>
  </div>

  <main id="home" class="screen home">
    <header class="hero">
      <div class="hero-deco" aria-hidden="true">
        <span class="cloud" style="left:56%;top:10%"></span>
        <span class="cloud small" style="left:80%;top:30%"></span>
        <span class="deco-sprite" data-sprite="balloon" style="left:66%;top:42%"></span>
        <span class="deco-sprite" data-sprite="box" style="left:84%;top:62%"></span>
        <span class="deco-sprite hero-player" data-sprite="player" style="left:70%;top:58%"></span>
      </div>
      <div class="hero-title">
        <h1>滾滾解謎</h1>
        <p class="hero-sub">推箱子、浮起來、滑過去、彈上去</p>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="切換主題"></button>
    </header>

    <p id="offline-status" class="offline-status" role="status"></p>
    <div id="home-notice" class="notice" role="alert" hidden></div>

    <button type="button" id="continue-btn" class="continue-btn" hidden>
      <span class="continue-title">繼續遊戲</span>
      <span id="continue-detail" class="continue-detail"></span>
    </button>

    <h2 class="section-title">章節</h2>
    <div id="chapter-list" class="chapter-list"></div>

    <nav class="home-links">
      <a id="portal-link" class="link-btn" href="../" hidden>‹ 所有遊戲</a>
      <button type="button" id="book-btn" class="link-btn">物理圖鑑</button>
      <button type="button" id="stats-btn" class="link-btn">統計</button>
      <button type="button" id="rules-btn" class="link-btn">玩法</button>
    </nav>
  </main>

  <main id="chapter" class="screen chapter" hidden>
    <header class="game-bar">
      <button type="button" id="chapter-back-btn" class="bar-btn">‹ 首頁</button>
      <div id="chapter-title" class="bar-title"></div>
      <span id="chapter-stars" class="bar-stars"></span>
    </header>
    <p id="chapter-theme" class="chapter-theme"></p>
    <div id="level-grid" class="level-grid"></div>
  </main>

  <main id="game" class="screen game" hidden>
    <header class="game-bar">
      <button type="button" id="game-back-btn" class="bar-btn" aria-label="回關卡列表">‹ 關卡</button>
      <div class="game-info">
        <span id="level-name" class="level-name"></span>
        <span class="info-line"><span id="steps">0 步</span><span class="dot">·</span><span id="timer">00:00</span></span>
      </div>
      <button type="button" id="menu-btn" class="bar-btn">選單</button>
    </header>
    <p id="level-hint" class="level-hint" hidden></p>

    <div class="board-wrap" id="board-wrap">
      <div id="board" class="board" role="img" aria-label="遊戲盤面"></div>
      <div id="pause-cover" class="pause-cover" hidden>
        <p>已暫停</p>
        <button type="button" id="resume-btn" class="primary-btn">繼續</button>
      </div>
    </div>

    <div class="controls">
      <p id="game-message" class="game-message" aria-live="polite"></p>
      <div class="tools">
        <button type="button" id="undo-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">↶</span>復原</button>
        <button type="button" id="restart-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⟲</span>重來</button>
        <button type="button" id="hint-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">💡</span>提示<span id="hint-count" class="tool-badge">3</span></button>
        <button type="button" id="pause-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⏸</span>暫停</button>
      </div>
      <div class="dpad">
        <button type="button" class="dpad-btn" data-move="L" aria-label="往左">◀</button>
        <button type="button" class="dpad-btn" data-move="U" aria-label="往上爬">▲</button>
        <button type="button" class="dpad-btn" data-move="D" aria-label="往下">▼</button>
        <button type="button" class="dpad-btn" data-move="R" aria-label="往右">▶</button>
      </div>
    </div>
  </main>

  <div id="loading" class="overlay" hidden>
    <div class="dialog loading-dialog" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">思考中…</p>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</body>
</html>
