<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>離線社會科學</title>
  <meta name="description" content="可離線遊玩的國小到國中社會科遊戲：歷史、地理、公民與社會，答錯時引導思考，間隔複習幫你記得更牢">
  <meta name="theme-color" content="#7f5f48">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="社會科學">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>有新版本可以使用</span>
    <button type="button" id="update-btn" class="banner-btn">重新整理以更新</button>
  </div>

  <main id="home" class="screen home">
    <header class="home-header">
      <div class="hero-deco" aria-hidden="true"><span style="left:56%;top:8%;font-size:28px">🏛️</span><span style="left:76%;top:6%;font-size:24px">🗺️</span><span style="left:88%;top:42%;font-size:26px">⚖️</span><span style="left:64%;top:60%;font-size:24px">🧭</span></div>
      <div class="hero-title">
        <h1>社會科學</h1>
        <p class="hero-sub">歷史・地理・公民，小三到國九</p>
      </div>
      <button type="button" id="theme-btn" class="icon-btn" aria-label="切換主題"></button>
    </header>

    <p id="offline-status" class="offline-status" role="status"></p>
    <div id="home-notice" class="notice" role="alert" hidden></div>

    <button type="button" id="continue-btn" class="continue-btn" hidden>
      <span class="continue-title">繼續遊戲</span>
      <span id="continue-detail" class="continue-detail"></span>
    </button>

    <button type="button" id="today-btn" class="today-btn"><span class="today-title">🔁 今日複習</span><span class="today-sub">到期的題目 <b id="today-count">0</b> 題</span></button>

    <h2 class="section-title">1. 選科目</h2>
    <div id="subject-list" class="topic-list" role="radiogroup" aria-label="科目"></div>
    <div id="topic-box" class="topic-box" hidden>
      <p class="topic-help">想預習或複習某個單元？選一個或多個主題（不選就是全部主題）。</p>
      <div id="topic-list" class="topic-list topics" role="group" aria-label="主題"></div>
    </div>

    <h2 class="section-title">2. 選難度開始（每局 10 題）</h2>
    <div id="difficulty-list" class="difficulty-list"></div>
    <p class="reward-note">🎁 每個難度第一次過關、第一次全對，可以在口袋地城領獎勵禮包</p>

    <nav class="home-links">
      <a id="portal-link" class="link-btn" href="../" hidden>‹ 所有遊戲</a>
      <button type="button" id="cards-btn" class="link-btn">知識圖鑑</button>
      <button type="button" id="review-btn" class="link-btn">錯題本</button>
      <button type="button" id="rules-btn" class="link-btn">玩法</button>
      <button type="button" id="stats-btn" class="link-btn">統計</button>
      <button type="button" id="rest-btn" class="link-btn"></button>
    </nav>
  </main>

  <main id="game" class="screen game" hidden>
    <header class="game-bar">
      <button type="button" id="home-btn" class="bar-btn" aria-label="回首頁">‹ 首頁</button>
      <div class="game-info">
        <span id="game-difficulty"></span>
        <span class="dot">·</span>
        <span id="progress"></span>
        <span class="dot">·</span>
        <span id="timer" aria-label="耗時">00:00</span>
        <span class="dot">·</span>
        <span id="mistakes">答錯 0</span>
      </div>
      <button type="button" id="menu-btn" class="bar-btn" aria-label="選單">選單</button>
    </header>

    <div id="play-area" class="play-area">
      <div id="sheet" class="sheet">
        <p id="topic" class="topic"></p>
        <div id="question" class="question"></div>
        <section id="hints" class="hints" aria-live="polite" hidden>
          <h3>💡 想一想</h3>
          <ul id="hints-list"></ul>
        </section>
        <section id="explain" class="explain" aria-live="polite" hidden>
          <h3>✓ 答對了！</h3>
          <p id="explain-text"></p>
        </section>
        <section id="card" class="sci-card" hidden></section>
        <p id="game-message" class="game-message" aria-live="polite"></p>
      </div>
      <div id="work" class="work" role="group" aria-label="作答區"></div>
      <div id="pause-cover" class="pause-cover" hidden>
        <p id="pause-title">已暫停</p>
        <p id="pause-sub" class="pause-sub" hidden>看看遠方 20 秒，讓眼睛放鬆一下</p>
        <button type="button" id="resume-btn" class="primary-btn">繼續</button>
      </div>
    </div>

    <div class="tools">
      <button type="button" id="hint-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">💡</span>解題重點<span id="hint-count" class="tool-badge">0</span></button>
      <button type="button" id="pause-btn" class="tool-btn"><span class="tool-icon" aria-hidden="true">⏸</span>暫停</button>
      <button type="button" id="check-btn" class="next-btn" hidden>檢查</button>
      <button type="button" id="next-btn" class="next-btn" hidden>下一題 ›</button>
    </div>
  </main>

  <div id="modal" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
</body>
</html>
